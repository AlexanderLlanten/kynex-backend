server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: kynex-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kynex}
    username: ${DB_USERNAME:kynex}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
kynex:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: kynex-api
    access-duration: PT10M
    refresh-duration: P7D
    cookie-secure: ${COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  commerce:
    emulator-enabled: ${PAYMENT_EMULATOR_ENABLED:false}
    order-duration: PT15M
springdoc:
  swagger-ui:
    path: /swagger-ui.html
