name: Backend PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: kynex_test
          POSTGRES_USER: kynex
          POSTGRES_PASSWORD: ci-isolated-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kynex -d kynex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/kynex_test
      DB_USERNAME: kynex
      DB_PASSWORD: ci-isolated-password
      JWT_SECRET: ci-only-random-key-not-for-deployment-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B -ntp verify
