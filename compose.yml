services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-kynex}
      POSTGRES_USER: ${DB_USERNAME:-kynex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
